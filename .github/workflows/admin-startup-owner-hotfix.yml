name: Consolidar admin pós-startup

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/admin-startup-owner-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-admin-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Consolidar carregamento administrativo
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';

          const appPath = 'beta/app.js';
          const shellPath = 'beta/beta-shell.js';
          const runtimePath = 'beta/startup-runtime.js';
          assert.equal(execFileSync('git', ['hash-object', appPath], { encoding: 'utf8' }).trim(), '5a473f24b193888eb73ed72141f3a1867678a43a');
          assert.equal(execFileSync('git', ['hash-object', shellPath], { encoding: 'utf8' }).trim(), '7e0412bb12e08f9eb96c28f7c77ad084a5064907');
          assert.equal(execFileSync('git', ['hash-object', runtimePath], { encoding: 'utf8' }).trim(), '4d0217f13f548ea44b880422545f826f81e15f15');

          let app = await readFile(appPath, 'utf8');
          let shell = await readFile(shellPath, 'utf8');
          let runtime = await readFile(runtimePath, 'utf8');

          const appCall = '  schedulePostStartupAdminRefresh();\n';
          assert.equal(app.split(appCall).length - 1, 1, 'chamada pós-startup do app não encontrada');
          app = app.replace(appCall, '');
          const appHelper = 'function schedulePostStartupAdminRefresh() {\n  if (APP_ENVIRONMENT.id !== "beta") return;\n  const run = () => { void refreshBetaAdmin(); };\n  if (window.VOLT_STARTUP_STATE?.status === "ready") {\n    queueMicrotask(run);\n    return;\n  }\n  window.addEventListener("volt:startup-ready", run, { once: true });\n}\n\n';
          assert.equal(app.split(appHelper).length - 1, 1, 'helper pós-startup do app não encontrado');
          app = app.replace(appHelper, '');

          const throttle = '  if (now - lastRun < minimumInterval) return Promise.resolve(readSnapshotFor(method, api));';
          const throttleFixed = '  if (lastRun > 0 && now - lastRun < minimumInterval) return Promise.resolve(readSnapshotFor(method, api));';
          assert.equal(runtime.split(throttle).length - 1, 1, 'throttle de métodos pesados não encontrado');
          runtime = runtime.replace(throttle, throttleFixed);

          const shellAnchor = '  window.addEventListener("volt:beta-data", renderBetaExperience);\n  window.addEventListener("volt:cycle-context", renderBetaExperience);';
          const shellReplacement = '  window.addEventListener("volt:beta-data", renderBetaExperience);\n  window.addEventListener("volt:cycle-context", renderBetaExperience);\n  scheduleAdministrationBootstrap();';
          assert.equal(shell.split(shellAnchor).length - 1, 1, 'âncora de eventos do shell não encontrada');
          shell = shell.replace(shellAnchor, shellReplacement);

          const functionAnchor = 'function betaShellMarkup() {';
          const helper = 'function scheduleAdministrationBootstrap() {\n  const load = () => {\n    Promise.resolve(api.refreshAdmin())\n      .then(renderBetaExperience)\n      .catch(() => undefined);\n  };\n  if (window.VOLT_STARTUP_STATE?.status === "ready") {\n    queueMicrotask(load);\n    return;\n  }\n  window.addEventListener("volt:startup-ready", load, { once: true });\n}\n\n';
          assert.equal(shell.split(functionAnchor).length - 1, 1, 'âncora betaShellMarkup não encontrada');
          shell = shell.replace(functionAnchor, helper + functionAnchor);

          assert.doesNotMatch(app, /schedulePostStartupAdminRefresh/);
          assert.match(runtime, /lastRun > 0 && now - lastRun < minimumInterval/);
          assert.match(shell, /scheduleAdministrationBootstrap\(\)/);

          await writeFile(appPath, app);
          await writeFile(shellPath, shell);
          await writeFile(runtimePath, runtime);
          NODE
      - name: Validar JavaScript
        run: |
          node --check beta/app.js
          node --check beta/beta-shell.js
          node --check beta/startup-runtime.js
      - name: Commitar consolidação
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/app.js beta/beta-shell.js beta/startup-runtime.js
          git commit -m "fix(beta): consolidar admin após startup pronto"
          git push origin HEAD:fix/full-runtime-stabilization
