name: VOLT Android Widgets Gate

on:
  push:
    branches:
      - agent/android-widgets
    paths:
      - "native/android-widgets/**"
      - "src/volt-widget-bridge.js"
      - "src/widget-snapshot-adapter.mjs"
      - "tests/widget-snapshot-adapter.test.mjs"
      - ".github/workflows/android-widgets-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/android-widgets/**"
      - "src/volt-widget-bridge.js"
      - "src/widget-snapshot-adapter.mjs"
      - "tests/widget-snapshot-adapter.test.mjs"
      - ".github/workflows/android-widgets-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volt-android-widgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kotlin + Glance + APK gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: JavaScript snapshot and route tests
        run: node --test tests/widget-snapshot-adapter.test.mjs

      - name: Android unit tests, lint and debug APK
        run: >-
          gradle -p native/android-widgets
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --stacktrace

      - name: Verify APK and widget receivers
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android-widgets/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" AndroidManifest.xml > android-manifest.txt
          grep -q 'br.com.voltconsumo.app.widget.EnergyWidgetReceiver' android-manifest.txt
          grep -q 'br.com.voltconsumo.app.widget.WaterWidgetReceiver' android-manifest.txt
          grep -q 'br.com.voltconsumo.app.widget.SummaryWidgetReceiver' android-manifest.txt
          grep -q 'br.com.voltconsumo.app.widget.ReadingWidgetReceiver' android-manifest.txt
          grep -q 'volt' android-manifest.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: volt-android-widgets-debug-apk
          path: native/android-widgets/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volt-android-widgets-build-evidence
          path: |
            android-manifest.txt
            native/android-widgets/app/build/reports/tests
            native/android-widgets/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  emulator:
    name: Android emulator + WebView + deep link
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build runtime APK
        run: gradle -p native/android-widgets :app:assembleDebug --stacktrace

      - name: Emulator runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="native/android-widgets/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n br.com.voltconsumo.app/.MainActivity
            sleep 12
            adb shell am start -W -a android.intent.action.VIEW -d 'volt://reading/energy' br.com.voltconsumo.app
            sleep 6
            adb logcat -d -s VOLTAndroid:I '*:S' > android-runtime.log
            grep -q 'web-ready:https://www.voltconsumo.com.br/' android-runtime.log
            grep -q 'bridge-ready' android-runtime.log
            grep -q 'route-applied:reading/energy' android-runtime.log
            adb exec-out screencap -p > android-runtime.png

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volt-android-widgets-emulator-evidence
          path: |
            android-runtime.log
            android-runtime.png
          if-no-files-found: ignore
          retention-days: 7
