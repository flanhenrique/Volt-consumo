name: Corrigir fachada da API Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/api-facade-proxy-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Corrigir Proxy sobre API congelada
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/startup-runtime.js';
          assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), 'e5d1a1a8676c480432f55b808e58a7b5d4b5a054');
          let source = await readFile(path, 'utf8');
          const oldBlock = [
            '  apiTarget = value;',
            '  apiFacade = new Proxy(value, {',
            '    get(target, property, receiver) {',
            '      const member = Reflect.get(target, property, receiver);',
            '      const method = String(property);',
            '      if (typeof member !== "function") return member;',
            '      if (method === "refreshData") return (...args) => runDataRefresh(member, args);',
            '      if (!STARTUP_HEAVY_METHODS.has(method)) return member;',
            '      return (...args) => runHeavyMethod(method, member, args, target);',
            '    }',
            '  });'
          ].join('\n');
          const nextBlock = [
            '  apiTarget = value;',
            '  // A API publicada pelo app é Object.freeze(). Um Proxy cujo target seja',
            '  // esse objeto não pode devolver wrappers diferentes para propriedades',
            '  // não-configuráveis. Usamos um target neutro e lemos sempre da API real.',
            '  apiFacade = new Proxy(Object.create(null), {',
            '    get(_facadeTarget, property) {',
            '      const target = apiTarget;',
            '      const member = Reflect.get(target, property, target);',
            '      const method = String(property);',
            '      if (typeof member !== "function") return member;',
            '      if (method === "refreshData") return (...args) => runDataRefresh(member, args);',
            '      if (!STARTUP_HEAVY_METHODS.has(method)) return member;',
            '      return (...args) => runHeavyMethod(method, member, args, target);',
            '    }',
            '  });'
          ].join('\n');
          assert.equal(source.split(oldBlock).length - 1, 1, 'fachada antiga não encontrada de forma única');
          source = source.replace(oldBlock, nextBlock);
          assert.match(source, /new Proxy\(Object\.create\(null\)/, 'Proxy neutro não foi aplicado');
          assert.doesNotMatch(source, /new Proxy\(value,/, 'Proxy ainda usa a API congelada como target');
          await writeFile(path, source);
          NODE
      - name: Validar JavaScript
        run: node --check beta/startup-runtime.js
      - name: Commitar correção
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/startup-runtime.js
          git commit -m "fix(beta): corrigir proxy da API congelada"
          git push origin HEAD:fix/full-runtime-stabilization
