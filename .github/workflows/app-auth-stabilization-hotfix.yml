name: Estabilizar autenticação Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/app-auth-stabilization-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Reordenar autenticação e carga crítica
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/app.js';
          const expectedBlob = '21de6f0f8397bc267deef35e57ea7ef8740e55f6';
          const currentBlob = execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
          assert.equal(currentBlob, expectedBlob, `beta/app.js mudou antes do patch: ${currentBlob}`);
          let source = await readFile(path, 'utf8');
          const authMarker = '    setTimeout(async () => {\n      if (authEvent === "PASSWORD_RECOVERY") {';
          assert.equal(source.split(authMarker).length - 1, 1, 'callback de autenticação não encontrado de forma única');
          source = source.replace(authMarker, '    setTimeout(async () => {\n      if (authEvent === "INITIAL_SESSION" || authEvent === "TOKEN_REFRESHED") return;\n      if (authEvent === "USER_UPDATED" && session?.user) {\n        syncAuthIdentity(session.user);\n        return;\n      }\n      if (authEvent === "PASSWORD_RECOVERY") {');
          const functionPattern = /async function updateAuthScreen\(user\) \{[\s\S]*?\n\}\n\nfunction loadLegacySettings/;
          assert.match(source, functionPattern, 'updateAuthScreen não encontrado');
          const replacement = [
            'function syncAuthIdentity(user, publish = true) {',
            '  if (!user) return;',
            '  currentUserEmail = user.email || currentUserEmail || "";',
            '  currentDisplayName = user.user_metadata?.display_name || user.user_metadata?.name || currentDisplayName || "";',
            '  const displayName = currentDisplayName || currentUserEmail.split("@")[0] || "usuário";',
            '  const legacyName = $("#user-name");',
            '  if (legacyName) legacyName.textContent = displayName;',
            '  if (publish) notifyBetaDataUpdate();',
            '}',
            '',
            'async function updateAuthScreen(user) {',
            '  const signedIn = Boolean(user);',
            '  if (!signedIn) {',
            '    welcome.hidden = false;',
            '    dashboard.hidden = true;',
            '    $("#login-password").value = "";',
            '    $("#login-message").textContent = "Entre com seu e-mail e senha.";',
            '    $("#login-form")?.removeAttribute("aria-busy");',
            '    currentUserId = null;',
            '    currentUserEmail = "";',
            '    currentDisplayName = "";',
            '    readings = [];',
            '    waterReadings = [];',
            '    settings = { ...DEFAULT_SETTINGS };',
            '    waterSettings = { ...DEFAULT_WATER_SETTINGS };',
            '    betaAdminSnapshot = { available: false, authorized: false, organization: null, membership: null, members: [], invitations: [], message: "" };',
            '    betaOrganizationSnapshot = { available: false, activeOrganizationId: null, organizations: [], message: "" };',
            '    betaInvitationSnapshot = { present: Boolean(BETA_INVITATION_TOKEN), available: false, organization: null, role: null, expiresAt: null, message: "" };',
            '    mfaSnapshot = { available: false, enrolled: false, currentLevel: "aal1", nextLevel: "aal1", factorId: null, enrollment: null };',
            '    return;',
            '  }',
            '',
            '  currentUserId = user.id;',
            '  if (!(await enforceMfaForSession())) return;',
            '  welcome.hidden = true;',
            '  dashboard.hidden = true;',
            '  $("#login-password").value = "";',
            '  $("#login-message").textContent = "Carregando seus dados…";',
            '  $("#login-form")?.setAttribute("aria-busy", "true");',
            '  syncAuthIdentity(user, false);',
            '',
            '  await loadUserData(user.id);',
            '  render();',
            '  await Promise.resolve();',
            '',
            '  $("#login-message").textContent = "";',
            '  $("#login-form")?.removeAttribute("aria-busy");',
            '  welcome.hidden = true;',
            '  dashboard.hidden = false;',
            '',
            '  void recordOperationalEvent("session.started", "info", "auth", { assuranceLevel: mfaSnapshot.currentLevel });',
            '  void Promise.allSettled([',
            '    recordPrivacyAcceptance(user),',
            '    refreshBetaInvitation(),',
            '    refreshBetaAdmin(),',
            '    refreshBetaFeatureFlags(),',
            '    refreshBetaOperationalMetrics(),',
            '    checkOperationalHealth()',
            '  ]);',
            '}',
            '',
            'function loadLegacySettings'
          ].join('\n');
          source = source.replace(functionPattern, replacement);
          assert.match(source, /authEvent === "INITIAL_SESSION"/, 'INITIAL_SESSION não foi deduplicado no app');
          assert.match(source, /authEvent === "USER_UPDATED"/, 'USER_UPDATED não ganhou caminho leve');
          assert.match(source, /await loadUserData\(user\.id\);\n  render\(\);/, 'dados críticos não precedem o primeiro render');
          assert.match(source, /dashboard\.hidden = false;[\s\S]*Promise\.allSettled/, 'trabalho administrativo não foi movido para depois da exibição');
          await writeFile(path, source);
          NODE
      - name: Validar sintaxe
        run: node --check beta/app.js
      - name: Commitar patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/app.js
          git commit -m "perf(beta): priorizar dados da conta antes do dashboard"
          git push origin HEAD:fix/full-runtime-stabilization
