name: Volt application quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volt-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static, DOM, import and vendor integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Validate DOM contract, imports, local references, SW and checksums
        run: python tests/quality_gate.py
      - name: Validate billing, regulatory, OCR and PDF domain
        run: node --test tests/billing-domain.test.mjs
      - name: Validate backend helper semantics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHealthHandler } from './supabase/functions/_shared/health-core.mjs';
          import { createAuthLoginHandler } from './supabase/functions/_shared/auth-login-core.mjs';
          const origin = 'https://flanhenrique.github.io';
          const healthEnv = name => ({ SUPABASE_URL: 'https://volt.supabase.co', SUPABASE_SERVICE_ROLE_KEY: 'test-only', SUPABASE_ANON_KEY: 'public-test' })[name] || '';
          const healthy = createHealthHandler({ env: healthEnv, fetchFn: async () => new Response(null, { status: 200 }) });
          assert.equal((await healthy(new Request('https://edge.test/?probe=liveness'))).status, 200);
          assert.equal((await healthy(new Request('https://edge.test/?probe=readiness'))).status, 200);
          const authEnv = name => ({ BETA_APP_ORIGIN: origin, SUPABASE_URL: 'https://volt.supabase.co', SUPABASE_PUBLISHABLE_KEY: 'public-test' })[name] || '';
          const auth = createAuthLoginHandler({ env: authEnv, fetchFn: async () => Response.json({ access_token: 'a'.repeat(40), refresh_token: 'r'.repeat(40), expires_in: 3600, user: { id: 'user-1' } }) });
          assert.equal((await auth(new Request('https://edge.test/auth-login', { method: 'POST', headers: { origin: 'https://evil.test', 'content-type': 'application/json' }, body: '{}' }))).status, 403);
          NODE

  ios-shell:
    name: WebKit Safari and iPhone shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install test runtime
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Validate Safari desktop and iPhone shell
        run: npx playwright test --project=webkit-desktop --project=webkit-iphone
      - name: Upload WebKit trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: volt-webkit-trace
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Chromium startup, mobile and Service Worker
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install test runtime
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2; do
            if timeout 480s npx playwright install --with-deps chromium; then
              installed=1
              break
            fi
            echo "Playwright Chromium install failed or timed out (attempt $attempt/2)." >&2
            sleep 5
          done
          if [ "$installed" -ne 1 ]; then
            echo "Unable to install Chromium after two attempts." >&2
            exit 1
          fi
      - name: Run Chromium acceptance suite
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile --project=chromium-service-worker
      - name: Upload Liquid Glass screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volt-liquid-glass-screenshots
          path: test-results/**/visual-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Chromium traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
