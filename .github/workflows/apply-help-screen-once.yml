name: Apply VOLT help experience once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-help-screen-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply help screen, legal pages and PWA revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          help_section = r'''            <section id="page-help" class="page volt-help-page" data-page="help" aria-labelledby="help-title" hidden>
              <div class="help-shell">
                <header class="help-product-header">
                  <button class="help-back-button" type="button" data-nav="home" aria-label="Voltar ao início">
                    <svg class="icon" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
                  </button>
                  <div class="help-product-title">
                    <h1 id="help-title">VOLT</h1>
                    <p>Versão 1.0.0</p>
                  </div>
                </header>

                <div class="volt-help-hero" aria-label="Energia e água conectadas pelo VOLT">
                  <div class="help-orbit help-orbit-one" aria-hidden="true"></div>
                  <div class="help-orbit help-orbit-two" aria-hidden="true"></div>
                  <svg class="help-strike" viewBox="0 0 84 190" aria-hidden="true">
                    <path class="help-strike-path" d="M46 2 43 42 31 55 44 68 34 84 47 99 36 116 44 130 39 154 42 184"></path>
                  </svg>
                  <span class="help-orbit-icon help-orbit-water" aria-hidden="true"><svg class="icon"><use href="#icon-water"></use></svg></span>
                  <span class="help-orbit-icon help-orbit-energy" aria-hidden="true"><svg class="icon"><use href="#icon-bolt"></use></svg></span>
                  <span class="help-orbit-icon help-orbit-reading" aria-hidden="true"><svg class="icon"><use href="#icon-reading"></use></svg></span>
                  <span class="help-orbit-icon help-orbit-shield" aria-hidden="true"><svg class="icon"><use href="#icon-shield"></use></svg></span>
                  <span class="help-orbit-icon help-orbit-help" aria-hidden="true"><svg class="icon"><use href="#icon-help"></use></svg></span>
                  <div class="help-core" aria-hidden="true">
                    <span class="help-core-glow"></span>
                    <svg class="help-core-mark"><use href="#icon-bolt"></use></svg>
                  </div>
                </div>

                <div class="help-indicators" aria-hidden="true"><span></span><span></span><span></span></div>

                <div class="help-menu help-menu-primary glass-level-2">
                  <a class="help-menu-row" href="#help-faq">
                    <span class="help-menu-icon"><svg class="icon"><use href="#icon-help"></use></svg></span>
                    <span class="help-menu-copy"><strong>Central de ajuda</strong><small>Dúvidas frequentes e suporte</small></span>
                    <svg class="icon help-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                  </a>
                  <a class="help-menu-row" href="mailto:suporte@voltconsumo.com.br?subject=Feedback%20VOLT">
                    <span class="help-menu-icon"><svg class="icon"><use href="#icon-mail"></use></svg></span>
                    <span class="help-menu-copy"><strong>Enviar feedback</strong><small>Sugestões e problemas técnicos</small></span>
                    <svg class="icon help-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                  </a>
                </div>

                <div class="help-menu help-menu-secondary glass-level-2">
                  <a class="help-menu-row" href="./terms.html">
                    <span class="help-menu-icon"><svg class="icon"><use href="#icon-reading"></use></svg></span>
                    <span class="help-menu-copy"><strong>Termos de uso</strong></span>
                    <svg class="icon help-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                  </a>
                  <a class="help-menu-row" href="./privacy.html">
                    <span class="help-menu-icon"><svg class="icon"><use href="#icon-shield"></use></svg></span>
                    <span class="help-menu-copy"><strong>Política de privacidade</strong></span>
                    <svg class="icon help-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                  </a>
                  <a class="help-menu-row" href="./licenses.html">
                    <span class="help-menu-icon"><svg class="icon"><use href="#icon-reading"></use></svg></span>
                    <span class="help-menu-copy"><strong>Licenças</strong></span>
                    <svg class="icon help-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                  </a>
                  <a class="help-menu-row" href="./about.html">
                    <span class="help-menu-icon"><svg class="icon"><use href="#icon-help"></use></svg></span>
                    <span class="help-menu-copy"><strong>Sobre o VOLT</strong></span>
                    <svg class="icon help-chevron" aria-hidden="true"><use href="#icon-chevron"></use></svg>
                  </a>
                </div>

                <section id="help-faq" class="help-inline-panel glass-level-2" aria-labelledby="help-faq-title">
                  <div class="help-inline-heading"><p class="eyebrow">CENTRAL DE AJUDA</p><h2 id="help-faq-title">Dúvidas frequentes</h2></div>
                  <div class="faq-list">
                    <details><summary>Como registrar uma nova leitura?</summary><p>Escolha Energia ou Água, tire uma foto ou informe o valor manualmente, revise e confirme.</p></details>
                    <details><summary>Como a estimativa é calculada?</summary><p>O VOLT usa o consumo do ciclo e as tarifas configuradas. O resultado é uma estimativa e não substitui a fatura da concessionária.</p></details>
                    <details><summary>Por que preciso revisar o valor da foto?</summary><p>Reflexos e visores podem reduzir a precisão. O VOLT só registra o valor após sua confirmação.</p></details>
                    <details><summary>Preciso de suporte?</summary><p>Envie um e-mail para <a href="mailto:suporte@voltconsumo.com.br">suporte@voltconsumo.com.br</a>.</p></details>
                  </div>
                </section>

                <footer class="help-legal-footer">
                  <p>© 2026 HRX SOLUTIONS</p>
                  <p>CNPJ 68.588.217/0001-06</p>
                  <p>Todos os direitos reservados.</p>
                  <p>Desenvolvido com amor em Manaus, AM, Brasil</p>
                </footer>
              </div>
            </section>'''

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          pattern = re.compile(r'\n            <section id="page-help" class="page".*?\n          </main>', re.S)
          if not pattern.search(index):
              raise SystemExit('Bloco atual da página Ajuda não foi localizado com segurança.')
          index = pattern.sub('\n' + help_section + '\n          </main>', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          css_path = root / 'styles/pages.css'
          css = css_path.read_text(encoding='utf-8')
          start = '/* VOLT HELP EXPERIENCE 20260815.8 */'
          end = '/* END VOLT HELP EXPERIENCE 20260815.8 */'
          help_css = r'''
          /* VOLT HELP EXPERIENCE 20260815.8 */
          .volt-help-page { padding-bottom: calc(5.5rem + var(--safe-bottom)); }
          .help-shell { width: min(100%, 48rem); margin: 0 auto; display: grid; gap: var(--space-5); }
          .help-product-header { position: relative; display: grid; min-height: 4.75rem; place-items: center; }
          .help-product-title { display: grid; gap: .1rem; text-align: center; }
          .help-product-title h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2rem); letter-spacing: -.035em; }
          .help-product-title p { margin: 0; color: var(--text-secondary); font-size: var(--font-size-sm); }
          .help-back-button { position: absolute; left: 0; top: 50%; display: grid; width: 3rem; height: 3rem; place-items: center; transform: translateY(-50%); border: 1px solid var(--glass-border-strong); border-radius: 50%; background: var(--glass-control); color: var(--text-primary); box-shadow: var(--glass-shadow-control), inset 0 1px 0 var(--glass-highlight); }
          .help-back-button .icon { width: 1.35rem; height: 1.35rem; fill: none; stroke: currentColor; stroke-width: 2.2; }
          .volt-help-hero { position: relative; width: min(22rem, 78vw); aspect-ratio: 1; margin: -.35rem auto -.75rem; display: grid; place-items: center; }
          .help-orbit { position: absolute; border: 1px solid color-mix(in srgb, var(--text-tertiary) 24%, transparent); border-radius: 50%; opacity: .7; }
          .help-orbit-one { inset: 12%; }
          .help-orbit-two { inset: 24%; border-style: dashed; }
          .help-strike { position: absolute; top: -7%; left: 50%; width: 4.3rem; height: 58%; transform: translateX(-50%); overflow: visible; filter: drop-shadow(0 0 9px color-mix(in srgb, var(--volt-accent) 70%, transparent)); }
          .help-strike-path { fill: none; stroke: var(--volt-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: volt-help-strike 760ms cubic-bezier(.18,.88,.28,1) 120ms forwards; }
          .help-core { position: relative; display: grid; width: 7.7rem; height: 7.7rem; place-items: center; border: 1px solid color-mix(in srgb, var(--volt-accent) 34%, var(--glass-border)); border-radius: 2.25rem; background: linear-gradient(145deg, color-mix(in srgb, var(--volt-accent-soft) 72%, var(--glass-3)), var(--glass-2)); box-shadow: 0 22px 60px color-mix(in srgb, var(--volt-accent) 13%, transparent), inset 0 1px 0 var(--glass-highlight); opacity: 0; transform: scale(.9); animation: volt-help-core 520ms var(--ease-standard) 650ms forwards; }
          .help-core-mark { width: 3.8rem; height: 3.8rem; fill: color-mix(in srgb, var(--volt-accent) 26%, transparent); stroke: var(--volt-accent-strong); stroke-width: 1.8; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--volt-accent) 35%, transparent)); }
          .help-core-glow { position: absolute; width: 2.4rem; height: .55rem; bottom: .7rem; border-radius: 50%; background: color-mix(in srgb, var(--volt-accent) 62%, transparent); filter: blur(9px); animation: volt-help-pulse 2.4s ease-in-out 1.1s infinite; }
          .help-orbit-icon { position: absolute; display: grid; width: 3.1rem; height: 3.1rem; place-items: center; border: 1px solid color-mix(in srgb, var(--glass-border-strong) 78%, transparent); border-radius: 1rem; background: color-mix(in srgb, var(--glass-control) 68%, transparent); color: var(--text-tertiary); opacity: 0; transform: scale(.82); animation: volt-help-icon-in 420ms var(--ease-standard) forwards; }
          .help-orbit-icon .icon { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 1.75; }
          .help-orbit-water { top: 19%; left: 9%; color: var(--volt-water-strong); animation-delay: 760ms; }
          .help-orbit-energy { top: 18%; right: 9%; color: var(--volt-energy-strong); animation-delay: 820ms; }
          .help-orbit-reading { top: 48%; right: 2%; animation-delay: 880ms; }
          .help-orbit-shield { bottom: 13%; left: 14%; color: var(--volt-accent-strong); animation-delay: 940ms; }
          .help-orbit-help { bottom: 8%; right: 22%; color: var(--volt-accent-strong); animation-delay: 1000ms; }
          .help-indicators { display: flex; justify-content: center; gap: .55rem; margin-top: -1.15rem; }
          .help-indicators span { width: .52rem; height: .52rem; border-radius: 50%; background: color-mix(in srgb, var(--text-tertiary) 42%, transparent); }
          .help-indicators span:first-child { background: var(--volt-accent); box-shadow: 0 0 12px color-mix(in srgb, var(--volt-accent) 35%, transparent); }
          .help-menu { overflow: hidden; border: 1px solid var(--glass-border); border-radius: var(--radius-xl); box-shadow: var(--glass-shadow-soft); opacity: 0; transform: translateY(1rem); animation: volt-help-menu-in 520ms var(--ease-standard) forwards; }
          .help-menu-primary { animation-delay: 1020ms; }
          .help-menu-secondary { animation-delay: 1130ms; }
          .help-menu-row { display: grid; min-height: 4.8rem; padding: .9rem 1.05rem; align-items: center; gap: .9rem; color: inherit; text-decoration: none; grid-template-columns: auto minmax(0,1fr) auto; background: color-mix(in srgb, var(--glass-2) 88%, transparent); transition: background var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard); }
          .help-menu-row + .help-menu-row { border-top: 1px solid var(--glass-border); }
          .help-menu-row:hover { background: var(--glass-control); }
          .help-menu-row:active { transform: scale(.995); }
          .help-menu-icon { display: grid; width: 2.55rem; height: 2.55rem; place-items: center; border-radius: .9rem; background: var(--volt-accent-soft); color: var(--volt-accent-strong); }
          .help-menu-icon .icon { width: 1.28rem; height: 1.28rem; fill: none; stroke: currentColor; stroke-width: 1.85; }
          .help-menu-copy { min-width: 0; display: grid; gap: .08rem; }
          .help-menu-copy strong { font-size: clamp(1rem, 2vw, 1.12rem); }
          .help-menu-copy small { color: var(--text-secondary); line-height: 1.3; }
          .help-chevron { width: 1.2rem; height: 1.2rem; fill: none; stroke: var(--text-tertiary); stroke-width: 2; }
          .help-inline-panel { display: none; padding: var(--space-5); gap: var(--space-4); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); scroll-margin-top: 1rem; }
          .help-inline-panel:target { display: grid; animation: volt-help-menu-in 360ms var(--ease-standard) both; }
          .help-inline-heading h2 { margin: .1rem 0 0; }
          .help-inline-heading .eyebrow { margin: 0; }
          .help-inline-panel a { color: var(--volt-accent-strong); }
          .help-legal-footer { display: grid; justify-items: center; gap: .05rem; padding: .35rem 1rem calc(.5rem + var(--safe-bottom)); color: var(--text-tertiary); text-align: center; font-size: .78rem; line-height: 1.45; opacity: 0; animation: volt-help-menu-in 420ms var(--ease-standard) 1240ms forwards; }
          .help-legal-footer p { margin: 0; }
          @keyframes volt-help-strike { to { stroke-dashoffset: 0; } }
          @keyframes volt-help-core { to { opacity: 1; transform: scale(1); } }
          @keyframes volt-help-icon-in { to { opacity: .9; transform: scale(1); } }
          @keyframes volt-help-menu-in { to { opacity: 1; transform: translateY(0); } }
          @keyframes volt-help-pulse { 0%,100% { opacity: .32; transform: scale(.86); } 50% { opacity: .78; transform: scale(1.15); } }
          @media (max-width: 720px) {
            .volt-help-page { padding-top: .2rem; }
            .help-shell { gap: .9rem; }
            .help-product-header { min-height: 3.85rem; }
            .help-back-button { width: 2.75rem; height: 2.75rem; }
            .volt-help-hero { width: min(18.5rem, 76vw); margin-top: -.7rem; margin-bottom: -1.25rem; }
            .help-core { width: 6.45rem; height: 6.45rem; border-radius: 1.85rem; }
            .help-core-mark { width: 3.15rem; height: 3.15rem; }
            .help-orbit-icon { width: 2.65rem; height: 2.65rem; border-radius: .82rem; }
            .help-orbit-icon .icon { width: 1.18rem; height: 1.18rem; }
            .help-menu { border-radius: 1.55rem; }
            .help-menu-row { min-height: 4.45rem; padding: .75rem .9rem; gap: .72rem; }
            .help-menu-icon { width: 2.35rem; height: 2.35rem; }
            .help-legal-footer { font-size: .72rem; }
          }
          /* END VOLT HELP EXPERIENCE 20260815.8 */
          '''
          css = css.rstrip() + '\n\n' + help_css.strip() + '\n'
          css_path.write_text(css, encoding='utf-8')

          legal_css = r'''@import url("./styles/tokens.css?v=20260813.7");
          * { box-sizing: border-box; }
          html { min-height: 100%; background: var(--page-bg-deep); }
          body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--volt-accent) 13%, transparent), transparent 28rem), linear-gradient(145deg, var(--page-bg), var(--page-bg-deep)); color: var(--text-primary); font-family: var(--font-sans); line-height: 1.6; }
          a { color: var(--volt-accent-strong); }
          .skip-link { position: fixed; left: 1rem; top: -5rem; z-index: 10; padding: .65rem 1rem; border-radius: 999px; background: var(--text-primary); color: var(--page-bg); }
          .skip-link:focus { top: 1rem; }
          .legal-page { width: min(100% - 2rem, 52rem); margin: 0 auto; padding: max(2.5rem, env(safe-area-inset-top)) 0 max(3rem, env(safe-area-inset-bottom)); }
          .legal-brand { display: inline-flex; align-items: center; gap: .55rem; color: var(--text-primary); text-decoration: none; font-weight: 900; letter-spacing: .08em; }
          .legal-brand img { width: 2.1rem; height: 2.1rem; }
          .eyebrow { margin: 2.25rem 0 .3rem; color: var(--volt-accent-strong); font-size: .75rem; font-weight: 900; letter-spacing: .12em; }
          h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; letter-spacing: -.045em; }
          .lead { margin: .65rem 0 2rem; color: var(--text-secondary); }
          .card { margin: 1rem 0; padding: 1.25rem; border: 1px solid var(--glass-border); border-radius: var(--radius-lg); background: var(--glass-2); box-shadow: var(--glass-shadow-soft); backdrop-filter: blur(var(--glass-blur)); }
          .legal-section h2 { margin-top: 0; font-size: 1.1rem; }
          .legal-section p:last-child, .legal-section ul:last-child { margin-bottom: 0; }
          .legal-section li + li { margin-top: .4rem; }
          .legal-back { margin: 2rem 0 0; }
          .legal-footer { margin-top: 2.25rem; padding-top: 1.25rem; border-top: 1px solid var(--glass-border); color: var(--text-tertiary); font-size: .78rem; text-align: center; }
          .legal-footer p { margin: .08rem 0; }
          @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --volt-accent: #39dfa9; --volt-accent-strong: #64edbd; --volt-accent-soft: rgba(48, 207, 157, .15); --page-bg: #050506; --page-bg-deep: #000; --text-primary: #f4f5f5; --text-secondary: #b5b8b7; --text-tertiary: #7d8481; --glass-2: rgba(24,26,26,.72); --glass-border: rgba(255,255,255,.14); --glass-shadow-soft: 0 14px 38px rgba(0,0,0,.36); } }
          '''
          (root / 'styles.css').write_text(legal_css, encoding='utf-8')

          def legal_page(title, eyebrow, lead, sections):
              blocks = '\n'.join(f'''    <section class="card legal-section">\n      <h2>{heading}</h2>\n      {body}\n    </section>''' for heading, body in sections)
              return f'''<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#06130f">
            <meta name="robots" content="noindex,nofollow">
            <link rel="icon" href="./icon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="./styles.css">
            <title>{title} — VOLT</title>
          </head>
          <body>
            <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
            <main id="conteudo" class="legal-page">
              <a class="legal-brand" href="./index.html"><img src="./icon.svg" alt=""> VOLT</a>
              <p class="eyebrow">{eyebrow}</p>
              <h1>{title}</h1>
              <p class="lead">{lead}</p>
          {blocks}
              <p class="legal-back"><a href="./index.html">Voltar ao VOLT</a></p>
              <footer class="legal-footer"><p>© 2026 HRX SOLUTIONS</p><p>CNPJ 68.588.217/0001-06</p><p>Todos os direitos reservados.</p><p>Desenvolvido com amor em Manaus, AM, Brasil</p></footer>
            </main>
          </body>
          </html>
          '''

          terms = legal_page('Termos de Uso', 'VOLT · CONDIÇÕES DE USO', 'Versão 1.0 · 15 de agosto de 2026', [
              ('1. Finalidade do VOLT', '<p>O VOLT permite registrar leituras de energia e água, acompanhar consumo, metas e estimativas e organizar informações fornecidas pelo próprio usuário.</p>'),
              ('2. Estimativas e faturas', '<p>Valores, projeções e alertas apresentados pelo VOLT têm caráter informativo. A cobrança oficial, os tributos, subsídios, bandeiras e demais componentes da fatura são definidos pela concessionária e pelas regras aplicáveis ao período.</p>'),
              ('3. Conta e informações', '<p>O usuário deve manter seus dados de acesso protegidos e revisar leituras, tarifas e informações importadas antes de utilizá-las como referência para decisões financeiras.</p>'),
              ('4. Privacidade', '<p>O tratamento de dados pessoais é descrito na <a href="./privacy.html">Política de Privacidade</a> do VOLT.</p>'),
              ('5. Propriedade intelectual', '<p>© 2026 HRX SOLUTIONS — CNPJ 68.588.217/0001-06. Todos os direitos reservados sobre os elementos próprios do produto, observados os direitos e licenças de terceiros indicados na página de licenças.</p>'),
              ('6. Suporte', '<p>Problemas técnicos podem ser encaminhados para <a href="mailto:suporte@voltconsumo.com.br">suporte@voltconsumo.com.br</a> e assuntos gerais para <a href="mailto:contato@voltconsumo.com.br">contato@voltconsumo.com.br</a>.</p>')
          ])
          (root / 'terms.html').write_text(terms, encoding='utf-8')

          licenses = legal_page('Licenças', 'VOLT · SOFTWARE', 'Componentes próprios e de terceiros', [
              ('VOLT', '<p>© 2026 HRX SOLUTIONS — CNPJ 68.588.217/0001-06. Todos os direitos reservados sobre os componentes próprios do VOLT.</p>'),
              ('Software de terceiros', '<p>Bibliotecas e serviços de terceiros permanecem sujeitos aos seus respectivos direitos autorais, termos e licenças. O cliente Supabase distribuído no projeto mantém sua licença original.</p><p><a href="./vendor/supabase/LICENSE">Consultar a licença do cliente Supabase incluída no projeto</a>.</p>'),
              ('Dependências de desenvolvimento', '<p>Ferramentas usadas para desenvolvimento e testes não transferem seus direitos ao VOLT e continuam regidas pelas licenças de seus respectivos titulares.</p>')
          ])
          (root / 'licenses.html').write_text(licenses, encoding='utf-8')

          about = legal_page('Sobre o VOLT', 'VOLT · MANAUS, AMAZONAS', 'Consumo mais claro, com energia e água no mesmo lugar.', [
              ('O produto', '<p>O VOLT foi criado para transformar leituras de medidores e informações de fatura em acompanhamento simples de consumo, metas, histórico e estimativas.</p>'),
              ('Versão', '<p>Aplicativo VOLT 1.0.0 · build 20260815.8.</p>'),
              ('Canais oficiais', '<p>Contato: <a href="mailto:contato@voltconsumo.com.br">contato@voltconsumo.com.br</a><br>Suporte: <a href="mailto:suporte@voltconsumo.com.br">suporte@voltconsumo.com.br</a></p>'),
              ('Desenvolvimento', '<p>Desenvolvido com amor em Manaus, AM, Brasil.</p>')
          ])
          (root / 'about.html').write_text(about, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace('const CACHE_REVISION = "20260815.7";', 'const CACHE_REVISION = "20260815.8";')
          sw = sw.replace('const UPDATE_BUILD = "20260815.7";', 'const UPDATE_BUILD = "20260815.8";')
          if '"volt-app-v4-atomic-20260815.7"' not in sw:
              sw = sw.replace('  CACHE_NAME,\n', '  CACHE_NAME,\n  "volt-app-v4-atomic-20260815.7",\n', 1)
          if '  "./styles.css",' not in sw:
              sw = sw.replace('  "./version.json",\n', '  "./version.json",\n  "./styles.css",\n  "./terms.html",\n  "./privacy.html",\n  "./licenses.html",\n  "./about.html",\n', 1)
          sw_path.write_text(sw, encoding='utf-8')

          version = {
              'release': '20260815.8',
              'build': '20260815.8',
              'releasedAt': '2026-08-15T18:08:00Z',
              'message': 'Nova tela de Ajuda do VOLT com animação de raio, menus simplificados, canais de suporte e rodapé institucional da HRX SOLUTIONS.'
          }
          (root / 'version.json').write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run static quality gate
        run: python tests/quality_gate.py

      - name: Commit implementation and remove one-time workflow
