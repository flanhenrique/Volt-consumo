name: Guardar DOM crítico do bootstrap

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/bootstrap-dom-guards-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Tornar inicialização resiliente a DOM incompleto
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/app.js';
          assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), 'c45e5aeef2e60d78cd7f1ec83a9fa33ce84ff608');
          let source = await readFile(path, 'utf8');
          const replaceOnce = (from, to, label) => {
            assert.equal(source.split(from).length - 1, 1, `${label}: trecho não encontrado de forma única`);
            source = source.replace(from, to);
          };
          replaceOnce(
            ['function renderEngineSettings() {', '  const rows = listEngineDefinitions().map((engine) => {'].join('\n'),
            ['function renderEngineSettings() {', '  const list = $("#engine-list");', '  if (!list) return;', '  const rows = listEngineDefinitions().map((engine) => {'].join('\n'),
            'renderEngineSettings guard'
          );
          replaceOnce('  $("#engine-list").replaceChildren(...rows);', '  list.replaceChildren(...rows);', 'engine-list write');
          replaceOnce(
            ['function populateSettings() {', '  $("#rate").value = settings.rate.toFixed(6);', '  $("#goal").value = settings.goal;', '  $("#tariff-flag").value = settings.flag;', '  $("#lighting-fee").value = settings.lightingFee.toFixed(2);', '}', '', 'function populateWaterSettings() {', '  $("#water-rate").value = waterSettings.rate.toFixed(2);', '  $("#water-goal").value = waterSettings.goal;', '  $("#sewer-percent").value = waterSettings.sewerPercent;', '  $("#water-fixed-fee").value = waterSettings.fixedFee.toFixed(2);', '}', '', 'function setDefaultDate() {', '  const now = new Date();', '  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());', '  $("#reading-date").value = now.toISOString().slice(0, 16);', '  if ($("#water-reading-date")) $("#water-reading-date").value = now.toISOString().slice(0, 16);', '}'].join('\n'),
            ['function setControlValue(selector, value) {', '  const control = $(selector);', '  if (control) control.value = value;', '}', '', 'function populateSettings() {', '  setControlValue("#rate", settings.rate.toFixed(6));', '  setControlValue("#goal", settings.goal);', '  setControlValue("#tariff-flag", settings.flag);', '  setControlValue("#lighting-fee", settings.lightingFee.toFixed(2));', '}', '', 'function populateWaterSettings() {', '  setControlValue("#water-rate", waterSettings.rate.toFixed(2));', '  setControlValue("#water-goal", waterSettings.goal);', '  setControlValue("#sewer-percent", waterSettings.sewerPercent);', '  setControlValue("#water-fixed-fee", waterSettings.fixedFee.toFixed(2));', '}', '', 'function setDefaultDate() {', '  const now = new Date();', '  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());', '  const value = now.toISOString().slice(0, 16);', '  setControlValue("#reading-date", value);', '  setControlValue("#water-reading-date", value);', '}'].join('\n'),
            'bootstrap form guards'
          );
          replaceOnce(
            ['function applyTheme(theme) {', '  document.documentElement.dataset.theme = theme;', '  localStorage.setItem(THEME_KEY, theme);', '  document.querySelector(\'meta[name="theme-color"]\').content = theme === "dark" ? "#0e171d" : "#f3f6f9";'].join('\n'),
            ['function applyTheme(theme) {', '  document.documentElement.dataset.theme = theme;', '  localStorage.setItem(THEME_KEY, theme);', '  const themeColor = document.querySelector(\'meta[name="theme-color"]\');', '  if (themeColor) themeColor.content = theme === "dark" ? "#0e171d" : "#f3f6f9";'].join('\n'),
            'applyTheme meta guard'
          );
          replaceOnce(
            ['function restoreRememberPreference() {', '  const rememberUser = localStorage.getItem(REMEMBER_KEY) !== "false";', '  $("#remember-user").checked = rememberUser;', '  if (rememberUser) $("#login-email").value = localStorage.getItem(SAVED_EMAIL_KEY) || "";', '}'].join('\n'),
            ['function restoreRememberPreference() {', '  const rememberUser = localStorage.getItem(REMEMBER_KEY) !== "false";', '  const rememberControl = $("#remember-user");', '  if (rememberControl) rememberControl.checked = rememberUser;', '  if (rememberUser) setControlValue("#login-email", localStorage.getItem(SAVED_EMAIL_KEY) || "");', '}'].join('\n'),
            'remember preference guard'
          );
          assert.match(source, /function setControlValue/, 'helper de controle ausente');
          const defaultDateBody = source.match(/function setDefaultDate\(\) \{([\s\S]*?)\n\}/)?.[1] || '';
          assert.ok(defaultDateBody, 'setDefaultDate ausente após patch');
          assert.doesNotMatch(defaultDateBody, /\$\("#reading-date"\)\.value/, 'setDefaultDate ainda dereferencia leitura sem guarda');
          await writeFile(path, source);
          NODE
      - name: Validar JavaScript
        run: node --check beta/app.js
      - name: Commitar guardas
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/app.js
          git commit -m "fix(beta): blindar DOM crítico antes da autenticação"
          git push origin HEAD:fix/full-runtime-stabilization
