name: Consolidar entry point Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/bootstrap-entrypoint-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Substituir múltiplos módulos por bootstrap único
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/index.html';
          assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), '4352945116a20b33ae4224a8df534900a99fe193');
          let source = await readFile(path, 'utf8');
          const oldBlock = [
            '  <script type="module" src="./environment.js"></script>',
            '  <script type="module" src="./startup-runtime.js?v=98"></script>',
            '  <script type="module" src="./app.js"></script>',
            '  <script type="module" src="./beta-shell.js"></script>',
            '  <script type="module" src="./beta-v3.js"></script>'
          ].join('\n');
          assert.equal(source.split(oldBlock).length - 1, 1, 'bloco de módulos do index não encontrado de forma única');
          source = source.replace(oldBlock, '  <script type="module" src="./bootstrap.js"></script>');
          assert.equal((source.match(/<script type="module"/g) || []).length, 1, 'index ainda possui múltiplos entry points module');
          assert.match(source, /src="\.\/bootstrap\.js"/, 'bootstrap único ausente');
          await writeFile(path, source);
          NODE
      - name: Validar contratos
        run: |
          node --check beta/bootstrap.js
          grep -q 'src="./bootstrap.js"' beta/index.html
      - name: Commitar consolidação
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/index.html
          git commit -m "refactor(beta): carregar runtime por bootstrap único"
          git push origin HEAD:fix/full-runtime-stabilization
