name: Remover estilos inline do runtime

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/csp-runtime-style-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Tornar navegação compatível com CSP
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';

          const jsPath = 'beta/beta-v3.js';
          const cssPath = 'beta/beta-v3.css';
          assert.equal(execFileSync('git', ['hash-object', jsPath], { encoding: 'utf8' }).trim(), '82ed9a8a36eb9aa663ad3e7a1dea7b963adfd7da');
          let js = await readFile(jsPath, 'utf8');
          let css = await readFile(cssPath, 'utf8');

          js = js.replace('    measureNavigationHeight(shell);\n', '');

          const measureBlock = 'function measureNavigationHeight(shell) {\n  const navigation = shell.querySelector(".bottom-navigation");\n  if (!navigation || typeof ResizeObserver === "undefined") return;\n  const publish = () => {\n    const height = Math.round(navigation.getBoundingClientRect().height);\n    if (height > 0) document.documentElement.style.setProperty("--lm-nav-height", `${height}px`);\n  };\n  new ResizeObserver(publish).observe(navigation);\n  publish();\n}\n\n';
          assert.equal(js.split(measureBlock).length - 1, 1, 'medição inline da navegação não encontrada');
          js = js.replace(measureBlock, '');

          const navBlock = 'function enhanceNavigation(shell) {\n  const navigation = shell.querySelector(".bottom-navigation");\n  if (!navigation || navigation.querySelector(".nav-indicator")) return;\n  const indicator = document.createElement("span");\n  indicator.className = "nav-indicator";\n  indicator.dataset.ready = "false";\n  indicator.setAttribute("aria-hidden", "true");\n  navigation.prepend(indicator);\n  const move = () => {\n    const active = navigation.querySelector("button.active");\n    if (!active) return;\n    const bounds = active.getBoundingClientRect();\n    const reference = navigation.getBoundingClientRect();\n    if (!bounds.width) return;\n    indicator.style.setProperty("--nav-indicator-width", `${bounds.width}px`);\n    indicator.style.setProperty("--nav-indicator-x", `${bounds.left - reference.left}px`);\n  };\n  const release = () => {\n    move();\n    requestAnimationFrame(() => { indicator.dataset.ready = "true"; });\n  };\n  navigation.addEventListener("click", () => requestAnimationFrame(move));\n  window.addEventListener("resize", move, { passive: true });\n  const dashboard = document.querySelector("#dashboard");\n  if (!dashboard) return release();\n  if (!dashboard.hidden) return release();\n  const visibilityObserver = new MutationObserver(() => {\n    if (dashboard.hidden) return;\n    visibilityObserver.disconnect();\n    release();\n  });\n  visibilityObserver.observe(dashboard, { attributes: true, attributeFilter: ["hidden"] });\n}\n\n';
          const navReplacement = 'function enhanceNavigation(shell) {\n  // O estado ativo é desenhado integralmente pelo CSS externo. Além de respeitar\n  // a CSP, isso elimina medidas/estilos por frame durante navegação e resize.\n  const navigation = shell.querySelector(".bottom-navigation");\n  if (!navigation) return;\n  navigation.dataset.cspSafe = "true";\n}\n\n';
          assert.equal(js.split(navBlock).length - 1, 1, 'indicador inline antigo não encontrado');
          js = js.replace(navBlock, navReplacement);
          assert.doesNotMatch(js, /\.style\.setProperty\(/, 'beta-v3 ainda escreve style inline');

          const activeBlock = 'html[data-environment="beta"] .bottom-navigation button.active {\n  color: var(--lm-accent-contrast);\n}';
          const activeReplacement = 'html[data-environment="beta"] .bottom-navigation button.active {\n  border-radius: var(--lm-radius-md);\n  color: var(--lm-accent-contrast);\n  background: linear-gradient(150deg, var(--lm-accent-solid), var(--lm-accent-strong));\n  box-shadow: var(--lm-shadow-accent), inset 0 1px 0 #ffffff40;\n}';
          assert.equal(css.split(activeBlock).length - 1, 1, 'estado ativo da navegação não encontrado');
          css = css.replace(activeBlock, activeReplacement);
          css = css.replace('/* Cápsula deslizante. Posição e largura vêm de beta-v3.js. */', '/* Compatibilidade histórica: o indicador antigo não é mais criado pelo runtime. */');
          css = css.replace('   A altura real desta barra é medida em tempo de execução e devolvida a\n   `--lm-nav-height`; é dela que sai a reserva de rolagem do conteúdo.', '   A reserva inferior usa o token estático `--lm-nav-height`, evitando escrita\n   de style inline e mantendo o layout compatível com a CSP do aplicativo.');

          await writeFile(jsPath, js);
          await writeFile(cssPath, css);
          NODE
      - name: Validar JavaScript
        run: node --check beta/beta-v3.js
      - name: Commitar correção CSP
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/beta-v3.js beta/beta-v3.css
          git commit -m "fix(beta): remover estilos inline da navegação"
          git push origin HEAD:fix/full-runtime-stabilization
