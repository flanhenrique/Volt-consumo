name: Corrigir visibilidade compatível com CSP

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/csp-visibility-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Remover style inline do runtime
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const v3Path = 'beta/beta-v3.js';
          const gatePath = '.github/workflows/beta-quality-gate.yml';
          assert.equal(execFileSync('git', ['hash-object', v3Path], { encoding: 'utf8' }).trim(), '6188436d4cda02d733309f87fcfc0292a70061bc');
          assert.equal(execFileSync('git', ['hash-object', gatePath], { encoding: 'utf8' }).trim(), '321a3afad1d6c79b864ea5d86078c427d78d3719');
          let v3 = await readFile(v3Path, 'utf8');
          let gate = await readFile(gatePath, 'utf8');

          const oldGuard = `function installRuntimeVisibilityGuards() {
  if (!document.querySelector("style[data-volt-runtime-visibility]")) {
    const style = document.createElement("style");
    style.dataset.voltRuntimeVisibility = "true";
    style.textContent = \`
      html[data-environment="beta"] [hidden] { display: none !important; }
      html[data-environment="beta"][data-volt-home-ready="false"] .beta-v2-shell {
        visibility: hidden !important;
      }
      html[data-environment="beta"][data-volt-financial-ready="false"] #beta-home .financial-preview strong,
      html[data-environment="beta"][data-volt-financial-ready="false"] #beta-financial-total,
      html[data-environment="beta"][data-volt-financial-ready="false"] #beta-summary-values strong {
        visibility: hidden !important;
      }
    \`;
    document.head.append(style);
  }
  document.documentElement.dataset.voltStartupState = "waiting-account";
  document.documentElement.dataset.voltHomeReady = "false";
  document.documentElement.dataset.voltFinancialReady = "false";
  document.querySelector("#beta-home")?.setAttribute("aria-busy", "true");
}`;
          const newGuard = `function installRuntimeVisibilityGuards() {
  // As regras visuais vivem em bootstrap-guards.css para respeitar a CSP.
  document.documentElement.dataset.voltStartupState = "waiting-account";
  document.documentElement.dataset.voltHomeReady = "false";
  document.documentElement.dataset.voltFinancialReady = "false";
  document.querySelector("#beta-home")?.setAttribute("aria-busy", "true");
}`;
          assert.equal(v3.split(oldGuard).length - 1, 1, 'guard inline antigo não encontrado de forma única');
          v3 = v3.replace(oldGuard, newGuard);

          const oldAssertions = `          const betaV3 = await readFile('beta/beta-v3.js', 'utf8');
          assert.match(betaV3, /\\[hidden\\]\\s*\\{\\s*display:\\s*none\\s*!important/, 'proteção global de [hidden] ausente');
          assert.match(betaV3, /data-volt-financial-ready/, 'barreira de valores financeiros intermediários ausente');`;
          const newAssertions = `          const visibilityGuards = await readFile('beta/bootstrap-guards.css', 'utf8');
          assert.match(visibilityGuards, /\\[hidden\\]\\s*\\{\\s*display:\\s*none\\s*!important/, 'proteção estática global de [hidden] ausente');
          assert.match(visibilityGuards, /data-volt-financial-ready/, 'barreira estática de valores financeiros intermediários ausente');

          const betaV3 = await readFile('beta/beta-v3.js', 'utf8');
          assert.doesNotMatch(betaV3, /data-volt-runtime-visibility|createElement\\(["']style["']\\)/, 'runtime voltou a injetar CSS inline incompatível com CSP');
          assert.match(betaV3, /data-volt-financial-ready/, 'runtime perdeu controle do estado financeiro');`;
          assert.equal(gate.split(oldAssertions).length - 1, 1, 'assertions antigas de visibilidade não encontradas');
          gate = gate.replace(oldAssertions, newAssertions);

          assert.doesNotMatch(v3, /createElement\("style"\)|style\.textContent/, 'beta-v3 ainda cria style inline');
          await writeFile(v3Path, v3);
          await writeFile(gatePath, gate);
          NODE
      - name: Validar JavaScript
        run: node --check beta/beta-v3.js
      - name: Commitar correção CSP
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/beta-v3.js .github/workflows/beta-quality-gate.yml
          git commit -m "fix(beta): remover CSS inline bloqueado pela CSP"
          git push origin HEAD:fix/full-runtime-stabilization
