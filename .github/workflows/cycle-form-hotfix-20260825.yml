name: Cycle form hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cycle-form-hotfix-20260825.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          renderer = Path('src/renderer.js')
          text = renderer.read_text(encoding='utf-8')
          old = '  Object.entries(fields).forEach(([id, value]) => setInputValue(byId(id), value));\n'
          new = '  const cycleFieldIds = new Set([\n    "energy-cycle-start", "energy-cycle-end", "water-cycle-start", "water-cycle-end"\n  ]);\n  const cycleFormEditing = Boolean(document.getElementById("cycles-form")?.matches(":focus-within"));\n  Object.entries(fields).forEach(([id, value]) => {\n    if (cycleFormEditing && cycleFieldIds.has(id)) return;\n    setInputValue(byId(id), value);\n  });\n'
          if old not in text:
              raise SystemExit('renderer patch target not found')
          renderer.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          echo '' | base64 -d > tests/e2e/cycle-form.spec.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static quality gate
        run: npm run check:static

      - name: Cycle regression
        run: npx playwright test tests/e2e/cycle-form.spec.mjs --project=chromium-desktop --project=chromium-mobile

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer.js tests/e2e/cycle-form.spec.mjs
          git commit -m "fix: preserve cross-month cycle edits"
          git push origin HEAD:main
