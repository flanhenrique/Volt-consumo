name: Deploy beta health endpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/health/**"
      - "supabase/functions/_shared/health-core.mjs"
      - ".github/workflows/deploy-beta-health.yml"

permissions:
  contents: read

concurrency:
  group: deploy-beta-health
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: credentials
        name: Check deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure SUPABASE_ACCESS_TOKEN."
          fi
      - if: steps.credentials.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.credentials.outputs.enabled == 'true'
        name: Deploy public probes and authenticated deep health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy health --project-ref zatwcrouojjqnuuabdif --no-verify-jwt
