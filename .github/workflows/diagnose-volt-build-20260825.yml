name: Diagnose VOLT build identity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-volt-build-20260825.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find build identity writers
        shell: bash
        run: |
          echo '=== __VOLT_BUILD__ writers ==='
          grep -RIn --exclude-dir=.git --exclude='*.md' '__VOLT_BUILD__' . || true
          echo '=== 20260825.2 references ==='
          grep -RIn --exclude-dir=.git --exclude='*.md' '20260825\.2' . || true
          echo '=== BUILD-like global assignments ==='
          grep -RIn --exclude-dir=.git --exclude='*.md' -E 'VOLT_BUILD|UPDATE_BUILD|MODULE_BUILD' . || true
