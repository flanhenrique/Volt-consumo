name: Habilitar gate estático na estabilização

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/enable-static-branch-gate.yml"

permissions:
  contents: write

jobs:
  patch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Executar gate estático em pushes da branch
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const path = '.github/workflows/beta-quality-gate.yml';
          let source = await readFile(path, 'utf8');
          const from = '  push:\n    branches: [main]\n';
          const to = '  push:\n    branches: [main, fix/full-runtime-stabilization]\n';
          assert.equal(source.split(from).length - 1, 1, 'gatilho push do quality gate não encontrado de forma única');
          source = source.replace(from, to);
          await writeFile(path, source);
          NODE
      - name: Commitar gatilho
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/beta-quality-gate.yml
          git commit -m "ci(beta): executar quality gate na branch de estabilização"
          git push origin HEAD:fix/full-runtime-stabilization
