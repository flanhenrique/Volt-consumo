name: Fix PWA update loop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pwa-update-loop-20260825.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Align release identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          target = "20260825.4"

          # version.json is the release manifest exposed to the installed PWA.
          version_path = Path("version.json")
          version = json.loads(version_path.read_text(encoding="utf-8"))
          version.update({
              "release": target,
              "build": target,
              "releasedAt": "2026-08-26T00:05:00Z",
              "message": "Correção do atualizador do PWA: a versão instalada agora é reconhecida corretamente e o aviso de atualização deixa de reaparecer após concluir a instalação."
          })
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Make the bootstrap runtime identify itself with the same build that version.json advertises.
          bootstrap_path = Path("bootstrap.js")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          bootstrap = re.sub(r'const BOOTSTRAP_BUILD = "[^"]+";', f'const BOOTSTRAP_BUILD = "{target}";', bootstrap, count=1)
          bootstrap = re.sub(r'const ATOMIC_RELEASE = "[^"]+";', f'const ATOMIC_RELEASE = "{target}";', bootstrap, count=1)
          bootstrap = re.sub(r'const UPDATE_BUILD = "[^"]+";', f'const UPDATE_BUILD = "{target}";', bootstrap, count=1)
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          # Every mutable root asset in index.html must point at the same new build.
          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r'\?v=\d{8}\.\d+', f'?v={target}', index)
          index_path.write_text(index, encoding="utf-8")

          # Align local ES-module graph cache-busters and Supabase runtime version.
          for path in [Path("app.js"), *sorted(Path("src").glob("*.js"))]:
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'\?v=\d{8}\.\d+', f'?v={target}', text)
              if path.name == "supabase-loader.js":
                  text = re.sub(r'searchParams\.set\("v",\s*"[^"]+"\)', f'searchParams.set("v", "{target}")', text)
              path.write_text(text, encoding="utf-8")

          # A new worker/cache revision is required so installed PWAs actually receive the fix.
          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r'const RELEASE_ID = "[^"]+";', f'const RELEASE_ID = "{target}";', sw, count=1)
          sw = re.sub(r'const CACHE_REVISION = "[^"]+";', f'const CACHE_REVISION = "{target}";', sw, count=1)
          sw = re.sub(r'const BOOTSTRAP_BUILD = "[^"]+";', f'const BOOTSTRAP_BUILD = "{target}";', sw, count=1)
          sw = re.sub(r'const UPDATE_BUILD = "[^"]+";', f'const UPDATE_BUILD = "{target}";', sw, count=1)
          old_cache = '  "volt-app-v4-atomic-20260817.2",\n'
          marker = 'const OWNED_CACHE_NAMES = new Set([\n'
          if old_cache not in sw:
              sw = sw.replace(marker, marker + old_cache, 1)
          sw_path.write_text(sw, encoding="utf-8")

          # Static gate now derives the expected release from version.json and verifies all runtime identifiers.
          gate_path = Path("tests/quality_gate.py")
          gate = gate_path.read_text(encoding="utf-8")
          gate = re.sub(
              r'ROOT = Path\(__file__\)\.resolve\(\)\.parents\[1\]\nRELEASE_ID = "[^"]+"\nBOOTSTRAP_BUILD = "[^"]+"',
              'ROOT = Path(__file__).resolve().parents[1]\nVERSION_MANIFEST = json.loads((ROOT / "version.json").read_text(encoding="utf-8"))\nRELEASE_ID = str(VERSION_MANIFEST["build"])\nBOOTSTRAP_BUILD = RELEASE_ID',
              gate,
              count=1
          )
          anchor = 'check(f\'const ATOMIC_RELEASE = "{RELEASE_ID}"\' in bootstrap_source, "bootstrap deve atualizar o grafo atômico correto")\n'
          addition = (
              anchor
              + 'check(f\'const UPDATE_BUILD = "{RELEASE_ID}"\' in bootstrap_source, "bootstrap deve identificar o build instalado com version.json")\n'
              + 'check("globalThis.__VOLT_BUILD__ = UPDATE_BUILD" in bootstrap_source, "build instalado deve ser publicado ao atualizador")\n'
          )
          if 'bootstrap deve identificar o build instalado com version.json' not in gate:
              gate = gate.replace(anchor, addition, 1)
          sw_anchor = 'check(f\'const BOOTSTRAP_BUILD = "{BOOTSTRAP_BUILD}"\' in sw_source, "Service Worker deve conhecer o build do bootstrap")\n'
          sw_addition = (
              sw_anchor
              + 'check(f\'const CACHE_REVISION = "{RELEASE_ID}"\' in sw_source, "cache do Service Worker deve pertencer ao build publicado")\n'
              + 'check(f\'const UPDATE_BUILD = "{RELEASE_ID}"\' in sw_source, "Service Worker deve anunciar o mesmo build de version.json")\n'
          )
          if 'cache do Service Worker deve pertencer ao build publicado' not in gate:
              gate = gate.replace(sw_anchor, sw_addition, 1)
          gate_path.write_text(gate, encoding="utf-8")

          # Keep browser assertions synchronized with the new cache/build identifiers.
          sw_test = Path("tests/e2e/sw.spec.mjs")
          text = sw_test.read_text(encoding="utf-8")
          text = re.sub(r'volt-app-v4-atomic-\d{8}\.\d+', f'volt-app-v4-atomic-{target}', text)
          sw_test.write_text(text, encoding="utf-8")

          volt_test = Path("tests/e2e/volt.spec.mjs")
          text = volt_test.read_text(encoding="utf-8")
          text = re.sub(r'"202608(?:13\.7|15\.10|17\.2|25\.3)"', f'"{target}"', text)
          volt_test.write_text(text, encoding="utf-8")
          PY

      - name: Install test runtime
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate static release consistency
        run: npm run check:static

      - name: Validate update and service worker behavior
        run: npx playwright test tests/e2e/cycle-form.spec.mjs tests/e2e/sw.spec.mjs --project=chromium-desktop --project=chromium-service-worker

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bootstrap.js app.js src sw.js version.json tests/quality_gate.py tests/e2e/sw.spec.mjs tests/e2e/volt.spec.mjs
          git commit -m "fix: stop recurring PWA update prompt"
          git push origin HEAD:main
