name: Fix PWA update loop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pwa-update-loop-20260825.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Align every runtime release identifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          target = "20260825.4"

          version_path = Path("version.json")
          version = json.loads(version_path.read_text(encoding="utf-8"))
          version.update({
              "release": target,
              "build": target,
              "releasedAt": "2026-08-26T00:13:00Z",
              "message": "Correção do atualizador do PWA: a versão instalada agora é reconhecida corretamente e o aviso deixa de reaparecer após a atualização."
          })
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          bootstrap_path = Path("bootstrap.js")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          for name in ("BOOTSTRAP_BUILD", "ATOMIC_RELEASE", "UPDATE_BUILD"):
              bootstrap = re.sub(rf'const {name} = "[^"]+";', f'const {name} = "{target}";', bootstrap, count=1)
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          config_path = Path("config.js")
          config = config_path.read_text(encoding="utf-8")
          config = re.sub(r'const APPLICATION_BUILD = "[^"]+";', f'const APPLICATION_BUILD = "{target}";', config, count=1)
          config = re.sub(r'\?v=\d{8}\.\d+', f'?v={target}', config)
          config = re.sub(r'\n\s*"\./src/pwa-update\.js\?v=[^"]+",', '', config, count=1)
          config_path.write_text(config, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(r'\?v=\d{8}\.\d+', f'?v={target}', index)
          index_path.write_text(index, encoding="utf-8")

          for path in [Path("app.js"), *sorted(Path("src").glob("*.js"))]:
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'\?v=\d{8}\.\d+', f'?v={target}', text)
              if path.name == "supabase-loader.js":
                  text = re.sub(r'searchParams\.set\("v",\s*"[^"]+"\)', f'searchParams.set("v", "{target}")', text)
              path.write_text(text, encoding="utf-8")

          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          for name in ("RELEASE_ID", "CACHE_REVISION", "BOOTSTRAP_BUILD", "UPDATE_BUILD"):
              sw = re.sub(rf'const {name} = "[^"]+";', f'const {name} = "{target}";', sw, count=1)
          old_cache = '  "volt-app-v4-atomic-20260817.2",\n'
          marker = 'const OWNED_CACHE_NAMES = new Set([\n'
          if old_cache not in sw:
              sw = sw.replace(marker, marker + old_cache, 1)
          sw_path.write_text(sw, encoding="utf-8")

          gate_path = Path("tests/quality_gate.py")
          gate = gate_path.read_text(encoding="utf-8")
          gate = re.sub(
              r'ROOT = Path\(__file__\)\.resolve\(\)\.parents\[1\]\nRELEASE_ID = "[^"]+"\nBOOTSTRAP_BUILD = "[^"]+"',
              'ROOT = Path(__file__).resolve().parents[1]\nVERSION_MANIFEST = json.loads((ROOT / "version.json").read_text(encoding="utf-8"))\nRELEASE_ID = str(VERSION_MANIFEST["build"])\nBOOTSTRAP_BUILD = RELEASE_ID',
              gate,
              count=1
          )
          anchor = 'check(f\'const ATOMIC_RELEASE = "{RELEASE_ID}"\' in bootstrap_source, "bootstrap deve atualizar o grafo atômico correto")\n'
          if 'bootstrap deve identificar o build instalado com version.json' not in gate:
              gate = gate.replace(anchor, anchor + 'check(f\'const UPDATE_BUILD = "{RELEASE_ID}"\' in bootstrap_source, "bootstrap deve identificar o build instalado com version.json")\ncheck("globalThis.__VOLT_BUILD__ = UPDATE_BUILD" in bootstrap_source, "bootstrap deve publicar o build instalado")\n', 1)
          sw_anchor = 'check(f\'const BOOTSTRAP_BUILD = "{BOOTSTRAP_BUILD}"\' in sw_source, "Service Worker deve conhecer o build do bootstrap")\n'
          if 'cache do Service Worker deve pertencer ao build publicado' not in gate:
              gate = gate.replace(sw_anchor, sw_anchor + 'check(f\'const CACHE_REVISION = "{RELEASE_ID}"\' in sw_source, "cache do Service Worker deve pertencer ao build publicado")\ncheck(f\'const UPDATE_BUILD = "{RELEASE_ID}"\' in sw_source, "Service Worker deve anunciar o mesmo build de version.json")\n', 1)
          gate_path.write_text(gate, encoding="utf-8")

          sw_test = Path("tests/e2e/sw.spec.mjs")
          sw_text = sw_test.read_text(encoding="utf-8")
          sw_text = re.sub(r'volt-app-v4-atomic-\d{8}\.\d+', f'volt-app-v4-atomic-{target}', sw_text)
          sw_test.write_text(sw_text, encoding="utf-8")

          volt_test = Path("tests/e2e/volt.spec.mjs")
          volt_text = volt_test.read_text(encoding="utf-8")
          volt_text = re.sub(r'"202608(?:13\.7|14\.15|15\.10|16\.3|17\.2|25\.2|25\.3)"', f'"{target}"', volt_text)
          volt_test.write_text(volt_text, encoding="utf-8")
          PY

      - name: Verify deterministic build identity
        shell: bash
        run: |
          node --check bootstrap.js
          node --check config.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          target = json.loads(Path("version.json").read_text(encoding="utf-8"))["build"]
          assert target == "20260825.4"
          bootstrap = Path("bootstrap.js").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          index = Path("index.html").read_text(encoding="utf-8")
          assert f'const UPDATE_BUILD = "{target}"' in bootstrap
          assert f'const APPLICATION_BUILD = "{target}"' in config
          assert f'const UPDATE_BUILD = "{target}"' in sw
          assert f'const CACHE_REVISION = "{target}"' in sw
          assert f'bootstrap.js?v={target}' in index
          assert "src/pwa-update.js" not in config
          writers = []
          for path in [Path("bootstrap.js"), Path("config.js"), *Path("src").glob("*.js")]:
              text = path.read_text(encoding="utf-8")
              if "__VOLT_BUILD__ =" in text:
                  writers.append((str(path), text))
          assert len(writers) == 2, writers
          for path, text in writers:
              assert target in text, path
          stale = re.compile(r'const (?:APPLICATION_BUILD|UPDATE_BUILD|BOOTSTRAP_BUILD|ATOMIC_RELEASE|RELEASE_ID|CACHE_REVISION) = "(?:20260813\.7|20260815\.10|20260817\.2|20260825\.2|20260825\.3)"')
          for path in [Path("bootstrap.js"), Path("config.js"), Path("sw.js")]:
              assert not stale.search(path.read_text(encoding="utf-8")), path
          print("PWA BUILD IDENTITY: PASSOU")
          PY
          npm run check:static

      - name: Install test runtime
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Preserve cycle regression
        run: npx playwright test tests/e2e/cycle-form.spec.mjs --project=chromium-desktop

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bootstrap.js config.js app.js src sw.js version.json tests/quality_gate.py tests/e2e/sw.spec.mjs tests/e2e/volt.spec.mjs
          git commit -m "fix: stop recurring PWA update prompt"
          git push origin HEAD:main
