name: Hotfix Home e identidade (uma vez)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-home-identity-once.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(beta): aplicar hotfix de Home e identidade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Remover card legado e restaurar nome da conta
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile, rm } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';

          const path = 'beta/beta-shell.js';
          const expectedBlob = '90a499e6ba6293c638a4b932b743668161f1ca1e';
          const currentBlob = execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
          assert.equal(currentBlob, expectedBlob, `beta-shell.js mudou antes do hotfix (${currentBlob})`);

          let source = await readFile(path, 'utf8');

          function replaceOnce(from, to, label) {
            const first = source.indexOf(from);
            assert.notEqual(first, -1, `${label}: trecho não encontrado`);
            assert.equal(source.indexOf(from, first + from.length), -1, `${label}: trecho duplicado`);
            source = source.replace(from, to);
          }

          const tariffCard = `
        <article class="tariff-info-card">
          <div class="summary-header"><div><p class="eyebrow">COMPOSIÇÃO DA CONTA</p><h2>Tarifas e encargos</h2></div></div>
          <div class="tariff-info-list">
            <button type="button" data-tariff-info="energy"><span>Tarifa de energia</span><strong id="beta-tariff-energy">—</strong><i aria-hidden="true">i</i></button>
            <button type="button" data-tariff-info="flag"><span>Bandeira tarifária</span><strong id="beta-tariff-flag">—</strong><i aria-hidden="true">i</i></button>
            <button type="button" data-tariff-info="lighting"><span>Iluminação pública</span><strong id="beta-tariff-lighting">—</strong><i aria-hidden="true">i</i></button>
            <button type="button" data-tariff-info="sewer"><span>Taxa de esgoto</span><strong id="beta-tariff-sewer">Conforme cadastro</strong><i aria-hidden="true">i</i></button>
            <button type="button" data-tariff-info="taxes"><span>Impostos</span><strong>Conforme fatura</strong><i aria-hidden="true">i</i></button>
          </div>
        </article>`;
          replaceOnce(tariffCard, '', 'card Tarifas e encargos');

          replaceOnce(
            '  const displayName = snapshot.account.displayName?.trim();',
            '  const legacyDisplayName = document.querySelector("#user-name")?.textContent?.trim() || "";\n  const displayName = snapshot.account.displayName?.trim() || legacyDisplayName;',
            'fallback do nome de exibição'
          );

          replaceOnce('  renderTariffInformation();\n', '', 'chamada do renderer tarifário legado');

          const tariffRenderer = `
function renderTariffInformation() {
  const rate = Number(document.querySelector("#rate")?.value || 0);
  const lighting = Number(document.querySelector("#lighting-fee")?.value || 0);
  const flagText = document.querySelector("#tariff-flag")?.selectedOptions?.[0]?.textContent || "Não configurada";
  setText("#beta-tariff-energy", rate > 0 ? \`${'${currency(rate)}'}/kWh\` : "Não configurada");
  setText("#beta-tariff-flag", flagText.split("—")[0].trim());
  setText("#beta-tariff-lighting", lighting > 0 ? currency(lighting) : "Não configurada");
}
`;
          replaceOnce(tariffRenderer, '\n', 'renderer tarifário legado');

          assert.doesNotMatch(source, /Tarifas e encargos/, 'card legado ainda presente');
          assert.doesNotMatch(source, /renderTariffInformation/, 'renderer legado ainda presente');
          assert.match(source, /legacyDisplayName/, 'fallback do nome não aplicado');

          await writeFile(path, source);
          await rm('.github/workflows/hotfix-home-identity-once.yml');
          NODE
      - name: Validar JavaScript
        run: node --check beta/beta-shell.js
      - name: Commitar hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/beta-shell.js .github/workflows/hotfix-home-identity-once.yml
          git commit -m "fix(beta): remover card legado e restaurar nome"
          git push origin HEAD:main
