name: VOLT iOS native build

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "src/widget-snapshot.js"
      - "src/home-dashboard-sustainability.js"
      - ".github/workflows/ios-widget-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volt-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Xcode project and build app + widget
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Inspect generated schemes
        run: xcodebuild -project ios/VOLT.xcodeproj -list

      - name: Build VOLT for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/VOLT.xcodeproj \
            -scheme Volt \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build
