name: Adiar OCR da Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/ocr-lazyload-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Remover OCR do caminho crítico
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const appPath = 'beta/app.js';
          const indexPath = 'beta/index.html';
          assert.equal(execFileSync('git', ['hash-object', appPath], { encoding: 'utf8' }).trim(), '9abb1d472fef4b23e1fba08bd0c337e325bf8c76');
          assert.equal(execFileSync('git', ['hash-object', indexPath], { encoding: 'utf8' }).trim(), 'd7812d69c148e75ba0c8a0e1fe303991b3958b45');
          let app = await readFile(appPath, 'utf8');
          let index = await readFile(indexPath, 'utf8');

          const stateMarker = 'let scannerTarget = null;';
          assert.equal(app.split(stateMarker).length - 1, 1, 'estado do scanner não encontrado');
          app = app.replace(stateMarker, stateMarker + '\nlet tesseractLoadPromise = null;');

          const scanMarker = 'async function scanMeterPhoto(event) {';
          assert.equal(app.split(scanMarker).length - 1, 1, 'scanMeterPhoto não encontrado');
          const loader = [
            'function loadTesseractRuntime() {',
            '  if (window.Tesseract) return Promise.resolve(window.Tesseract);',
            '  if (tesseractLoadPromise) return tesseractLoadPromise;',
            '  tesseractLoadPromise = new Promise((resolve, reject) => {',
            '    const script = document.createElement("script");',
            '    script.src = "./vendor/tesseract/tesseract.min.js";',
            '    script.async = true;',
            '    script.dataset.voltTesseract = "true";',
            '    script.addEventListener("load", () => {',
            '      if (window.Tesseract) resolve(window.Tesseract);',
            '      else reject(new Error("OCR indisponível"));',
            '    }, { once: true });',
            '    script.addEventListener("error", () => reject(new Error("OCR indisponível")), { once: true });',
            '    document.head.append(script);',
            '  }).catch((error) => {',
            '    tesseractLoadPromise = null;',
            '    document.querySelector("script[data-volt-tesseract]")?.remove();',
            '    throw error;',
            '  });',
            '  return tesseractLoadPromise;',
            '}',
            '',
            scanMarker
          ].join('\n');
          app = app.replace(scanMarker, loader);

          const eagerOcr = '    if (!window.Tesseract) throw new Error("OCR indisponível");\n    const result = await window.Tesseract.recognize(file, "eng", {';
          assert.equal(app.split(eagerOcr).length - 1, 1, 'uso eager do Tesseract não encontrado');
          app = app.replace(eagerOcr, '    const tesseract = await loadTesseractRuntime();\n    const result = await tesseract.recognize(file, "eng", {');

          const indexScript = '  <script src="./vendor/tesseract/tesseract.min.js" defer></script>\n';
          assert.equal(index.split(indexScript).length - 1, 1, 'script eager do Tesseract não encontrado no index');
          index = index.replace(indexScript, '');

          assert.doesNotMatch(index, /tesseract\.min\.js/, 'Tesseract continua no caminho crítico do HTML');
          assert.match(app, /loadTesseractRuntime/, 'loader sob demanda do OCR ausente');
          await writeFile(appPath, app);
          await writeFile(indexPath, index);
          NODE
      - name: Validar JavaScript
        run: node --check beta/app.js
      - name: Commitar lazy load
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/app.js beta/index.html
          git commit -m "perf(beta): carregar OCR somente ao escanear medidor"
          git push origin HEAD:fix/full-runtime-stabilization
