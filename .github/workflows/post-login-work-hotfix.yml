name: Reduzir trabalho pós-login da Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/post-login-work-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Tirar telemetria administrativa do caminho pós-login
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/app.js';
          assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), '563dd35c059824199ff14c5ea2d1fdec2caeef3d');
          let source = await readFile(path, 'utf8');
          const oldBlock = [
            '  void Promise.allSettled([',
            '    recordPrivacyAcceptance(user),',
            '    refreshBetaInvitation(),',
            '    refreshBetaAdmin(),',
            '    refreshBetaFeatureFlags(),',
            '    refreshBetaOperationalMetrics(),',
            '    checkOperationalHealth()',
            '  ]);'
          ].join('\n');
          const nextBlock = [
            '  // Após a Home estar pronta, só mantemos tarefas leves necessárias à conta.',
            '  // Métricas, feature flags e health são carregados pela página que os utiliza.',
            '  void Promise.allSettled([',
            '    recordPrivacyAcceptance(user),',
            '    refreshBetaInvitation(),',
            '    refreshBetaAdmin()',
            '  ]);'
          ].join('\n');
          assert.equal(source.split(oldBlock).length - 1, 1, 'bloco pós-login não encontrado de forma única');
          source = source.replace(oldBlock, nextBlock);
          const authBody = source.match(/async function updateAuthScreen\(user\) \{([\s\S]*?)\n\}\n\nfunction loadLegacySettings/)?.[1] || '';
          assert.ok(authBody, 'updateAuthScreen não encontrado');
          assert.doesNotMatch(authBody, /refreshBetaFeatureFlags|refreshBetaOperationalMetrics|checkOperationalHealth/, 'trabalho administrativo pesado permaneceu no pós-login');
          assert.match(authBody, /refreshBetaAdmin\(\)/, 'autorização mínima de Usuários deixou de ser carregada');
          await writeFile(path, source);
          NODE
      - name: Validar JavaScript
        run: node --check beta/app.js
      - name: Commitar redução
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/app.js
          git commit -m "perf(beta): retirar métricas pesadas do pós-login"
          git push origin HEAD:fix/full-runtime-stabilization
