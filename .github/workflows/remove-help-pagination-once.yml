name: Remove false Help pagination once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-help-pagination-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove decorative pagination and bump PWA build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_build = "20260815.17"
          new_build = "20260816.1"

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = '      <div class="help-indicators" aria-hidden="true"><span></span><span></span><span></span></div>\n\n'
          if marker not in text:
              raise SystemExit("Indicadores da tela de Ajuda não encontrados")
          text = text.replace(marker, "", 1)
          path.write_text(text, encoding="utf-8")

          path = Path("bootstrap.js")
          text = path.read_text(encoding="utf-8")
          expected = f'const UPDATE_BUILD = "{old_build}";'
          if expected not in text:
              raise SystemExit("UPDATE_BUILD esperado não encontrado em bootstrap.js")
          text = text.replace(expected, f'const UPDATE_BUILD = "{new_build}";', 1)
          path.write_text(text, encoding="utf-8")

          path = Path("sw.js")
          text = path.read_text(encoding="utf-8")
          expected_cache = f'const CACHE_REVISION = "{old_build}";'
          expected_update = f'const UPDATE_BUILD = "{old_build}";'
          if expected_cache not in text or expected_update not in text:
              raise SystemExit("Build esperado não encontrado em sw.js")
          text = text.replace(expected_cache, f'const CACHE_REVISION = "{new_build}";', 1)
          text = text.replace(expected_update, f'const UPDATE_BUILD = "{new_build}";', 1)
          marker_cache = '  CACHE_NAME,\n'
          old_cache = f'  "volt-app-v4-atomic-{old_build}",\n'
          if old_cache not in text:
              text = text.replace(marker_cache, marker_cache + old_cache, 1)
          path.write_text(text, encoding="utf-8")

          Path("version.json").write_text(json.dumps({
              "release": new_build,
              "build": new_build,
              "releasedAt": "2026-08-16T16:27:00Z",
              "message": "Tela de Ajuda simplificada: removidos os três pontos decorativos abaixo da animação que davam a impressão incorreta de existir um carrossel com três páginas."
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate change
        shell: bash
        run: |
          ! grep -q 'class="help-indicators"' index.html
          node --check bootstrap.js
          node --check sw.js
          python tests/quality_gate.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "VOLT Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/remove-help-pagination-once.yml
          git add index.html bootstrap.js sw.js version.json
          git commit -m "fix: remove misleading Help pagination dots"
          git push origin main
