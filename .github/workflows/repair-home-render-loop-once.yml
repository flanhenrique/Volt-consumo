name: Repair VOLT dashboard render loop once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-home-render-loop-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair dashboard observers and resilient rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # Stop sustainability from observing the whole Home, including its own writes.
          path = Path('src/home-dashboard-sustainability.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('function observeHome() {')
          end = text.index('\n}\n\nfunction queue()', start) + 2
          observe_home = '''function observeHome() {
            if (observer) return;
            const sources = [
              $("home-energy-consumption"),
              $("home-water-consumption"),
              $("home-energy-goal"),
              $("home-water-goal")
            ].filter(Boolean);
            if (!sources.length) return;
            observer = new MutationObserver(queue);
            sources.forEach((source) => observer.observe(source, {
              childList: true,
              characterData: true,
              subtree: true
            }));
          }'''
          text = text[:start] + observe_home + text[end:]
          text = text.replace(
            '    if (copy) copy.textContent = `${formatNumber(percent, 0)}% da meta`;',
            '''    if (copy) {
              const nextCopy = `${formatNumber(percent, 0)}% da meta`;
              if (copy.textContent !== nextCopy) copy.textContent = nextCopy;
            }''',
            1
          )
          text = re.sub(
            r'    if \(status && percent > 100\) \{\n\s*status\.textContent = "Meta ultrapassada";\n\s*status\.dataset\.tone = "danger";\n\s*\}',
            '''    if (status && percent > 100) {
              if (status.textContent !== "Meta ultrapassada") status.textContent = "Meta ultrapassada";
              if (status.dataset.tone !== "danger") status.dataset.tone = "danger";
            }''',
            text,
            count=1
          )
          path.write_text(text, encoding='utf-8')

          # Make dashboard-v2 subscribe only to renderer-owned sources and isolate card failures.
          path = Path('src/home-dashboard-v2.js')
          text = path.read_text(encoding='utf-8')
          if 'let queued=false,dashboardObserver=null;' in text:
            text = text.replace('let queued=false,dashboardObserver=null;', 'let queued=false,dashboardObserver=null,sourceObserver=null;', 1)
          if 'observeDashboard();queue();' in text:
            text = text.replace('observeDashboard();queue();', 'observeDashboard();observeSources();queue();', 1)
          observe_dashboard = 'function observeDashboard(){const dashboard=$("dashboard");if(!dashboard||dashboardObserver)return;dashboardObserver=new MutationObserver(()=>{if(!dashboard.hidden)queue()});dashboardObserver.observe(dashboard,{attributes:true,attributeFilter:["hidden"]})}'
          observe_sources = 'function observeSources(){if(sourceObserver)return;const sources=[$("home-total-cost"),$("home-energy-cost"),$("home-water-cost"),$("home-energy-consumption"),$("consumption-chart")].filter(Boolean);if(!sources.length)return;sourceObserver=new MutationObserver(queue);sources.forEach(source=>sourceObserver.observe(source,{childList:true,characterData:true,subtree:true}))}'
          if observe_sources not in text:
            if observe_dashboard not in text:
              raise SystemExit('observeDashboard do dashboard-v2 não encontrado')
            text = text.replace(observe_dashboard, observe_dashboard + '\n' + observe_sources, 1)

          old_render = 'function render(){if($("dashboard")?.hidden)return;flag();const s=series();daily(s);evolution(s);composition()}'
          new_render = 'function render(){if($("dashboard")?.hidden)return;const s=series();safeRender("flag",flag);safeRender("daily",()=>daily(s));safeRender("evolution",()=>evolution(s));safeRender("composition",composition)}\nfunction safeRender(part,task){try{task()}catch(error){console.warn(`VOLT home ${part} render failed`,error)}}'
          if old_render in text:
            text = text.replace(old_render, new_render, 1)

          old_flag = 'function flag(){const key=$("energy-flag")?.value||"green",{label,rate}=flagData(key),kwh=num($("home-energy-consumption")?.textContent),impact=kwh*rate;$("home-insight-title").textContent=`Bandeira ${label}`;$("home-insight-body").textContent=rate?`Adicional de ${money(rate*100)} a cada 100 kWh.`:"Sem cobrança adicional de bandeira sobre o consumo de energia.";$("home-flag-impact").textContent=rate?`Impacto estimado: +${money(impact)}`:"Impacto estimado: R$ 0,00";$("home-insight-title")?.closest(".overview-card.status")?.setAttribute("data-flag",key)}'
          new_flag = 'function flag(){const key=$("energy-flag")?.value||"green",{label,rate}=flagData(key),kwh=num($("home-energy-consumption")?.textContent),impact=kwh*rate,title=$("home-insight-title"),body=$("home-insight-body"),impactNode=$("home-flag-impact");if(title)title.textContent=`Bandeira ${label}`;if(body)body.textContent=rate?`Adicional de ${money(rate*100)} a cada 100 kWh.`:"Sem cobrança adicional de bandeira sobre o consumo de energia.";if(impactNode)impactNode.textContent=rate?`Impacto estimado: +${money(impact)}`:"Impacto estimado: R$ 0,00";title?.closest(".overview-card.status")?.setAttribute("data-flag",key)}'
          if old_flag in text:
            text = text.replace(old_flag, new_flag, 1)
          path.write_text(text, encoding='utf-8')

          # Force the installed PWA onto a clean cache generation.
          path = Path('bootstrap.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('const UPDATE_BUILD = "20260815.12";', 'const UPDATE_BUILD = "20260815.13";', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('sw.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('const CACHE_REVISION = "20260815.12";', 'const CACHE_REVISION = "20260815.13";', 1)
          text = text.replace('const UPDATE_BUILD = "20260815.12";', 'const UPDATE_BUILD = "20260815.13";', 1)
          if '"volt-app-v4-atomic-20260815.12"' not in text:
            text = text.replace('  CACHE_NAME,\n', '  CACHE_NAME,\n  "volt-app-v4-atomic-20260815.12",\n', 1)
          path.write_text(text, encoding='utf-8')

          Path('version.json').write_text(json.dumps({
            'release': '20260815.13',
            'build': '20260815.13',
            'releasedAt': '2026-08-16T00:14:00Z',
            'message': 'Correção da Home no iPhone: remove o ciclo de renderização causado pelo observador da interface e isola gráficos e composição para que um card não bloqueie os demais.'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JavaScript and static contract
        shell: bash
        run: |
          node --check src/home-dashboard-v2.js
          node --check src/home-dashboard-sustainability.js
          node --check bootstrap.js
          node --check sw.js
          python tests/quality_gate.py

      - name: Commit fixed dashboard release
        shell: bash
        run: |
          git config user.name "VOLT Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair-home-render-loop-once.yml
          git add src/home-dashboard-v2.js src/home-dashboard-sustainability.js bootstrap.js sw.js version.json
          git commit -m "fix: stop home render loop and harden dashboard"
          git push origin main
