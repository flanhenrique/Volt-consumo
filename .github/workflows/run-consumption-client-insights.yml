name: Run consumption client insights

on:
  push:
    paths:
      - .github/workflows/run-consumption-client-insights.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consumption-current-cycle
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_consumption_client_insights.py
      - name: Validate
        run: |
          node --check src/renderer.js
          node --check src/billing-workflow.js
          git diff --check
          python tests/quality_gate.py
      - name: Commit branch
        run: |
          rm .github/scripts/apply_consumption_client_insights.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: turn consumption into current-cycle forecast"
          git push origin HEAD:feat/consumption-current-cycle
