name: Apply runtime reliability patch

on:
  push:
    branches: [fix/reliability-gate-20260824-v2]
    paths:
      - "scripts/apply-runtime-reliability-patch.mjs"
      - ".github/workflows/runtime-reliability-patch.yml"

permissions:
  contents: write

concurrency:
  group: volt-runtime-reliability-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reliability-gate-20260824-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Apply deterministic runtime patch
        run: node scripts/apply-runtime-reliability-patch.mjs
      - name: Validate syntax and static contract
        run: |
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          python tests/quality_gate.py
          node --test tests/*.test.mjs
      - name: Commit patched runtime
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "volt-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "fix: sincronizar runtime e tarifa histórica 20260824.1"
          git push origin HEAD:fix/reliability-gate-20260824-v2
