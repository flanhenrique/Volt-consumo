name: Estabilizar shell Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/runtime-stabilization-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Aplicar renderização por página ativa
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/beta-shell.js';
          const expectedBlob = '5812de4227f32b3576fcb4bd56b77bcade5532e7';
          const currentBlob = execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
          assert.equal(currentBlob, expectedBlob, `beta-shell.js mudou antes do patch: ${currentBlob}`);
          let source = await readFile(path, 'utf8');
          const intervalPattern = /  window\.setInterval\(\(\) => \{\n    if \(!document\.hidden\) Promise\.all\(\[api\.refreshFeatureFlags\(\), api\.refreshOperationalMetrics\(\)\]\)\.catch\(\(\) => undefined\);\n  \}, 25_000\);/;
          assert.match(source, intervalPattern, 'intervalo administrativo global não encontrado');
          const intervalReplacement = ['  window.setInterval(() => {','    const usersActive = document.querySelector("#beta-users")?.classList.contains("active");','    if (!document.hidden && usersActive) {','      Promise.all([api.refreshFeatureFlags(), api.refreshOperationalMetrics()]).catch(() => undefined);','    }','  }, 60_000);'].join('\n');
          source = source.replace(intervalPattern, intervalReplacement);
          const showPageMarker = '  document.querySelector("#beta-reading-fab").hidden = ["reports", "settings", "users"].includes(pageName);\n  requestAnimationFrame(resetPageScroll);';
          assert.equal(source.split(showPageMarker).length - 1, 1, 'marcador de showPage não encontrado de forma única');
          source = source.replace(showPageMarker, '  document.querySelector("#beta-reading-fab").hidden = ["reports", "settings", "users"].includes(pageName);\n  renderBetaExperience();\n  requestAnimationFrame(resetPageScroll);');
          const renderPattern = /function renderBetaExperience\(\) \{[\s\S]*?\n\}\n\nfunction renderFinancialSummary/;
          assert.match(source, renderPattern, 'renderBetaExperience não encontrado');
          const renderLines = [
            'function renderBetaExperience() {',
            '  const snapshot = api.getSnapshot();',
            '  const activePage = document.querySelector(".beta-page.active")?.dataset.page || "home";',
            '  const legacyDisplayName = document.querySelector("#user-name")?.textContent?.trim() || "";',
            '  const displayName = snapshot.account.displayName?.trim() || legacyDisplayName;',
            '',
            '  setText("#beta-greeting", displayName ? `Olá, ${displayName}!` : "Olá!");',
            '  const nameInput = document.querySelector("#beta-display-name");',
            '  if (nameInput && document.activeElement !== nameInput) nameInput.value = displayName || "";',
            '  const emailInput = document.querySelector("#beta-account-email");',
            '  if (emailInput) emailInput.value = snapshot.account.email || "";',
            '',
            '  renderInvitation();',
            '  renderAdministrationNavigation();',
            '',
            '  if (activePage === "readings") {',
            '    renderReadingHistory(snapshot);',
            '    return;',
            '  }',
            '  if (activePage === "users") {',
            '    renderAdministration();',
            '    return;',
            '  }',
            '  if (activePage === "settings") {',
            '    renderBetaMfa();',
            '    renderOperationalHealth();',
            '    return;',
            '  }',
            '  if (activePage !== "home") return;',
            '',
            '  const cycle = getCycleRanges();',
            '  const energyCurrent = cycleConsumption(snapshot.energy.readings, cycle.current);',
            '  const energyPrevious = cycleConsumption(snapshot.energy.readings, cycle.previous);',
            '  const waterCurrent = cycleConsumption(snapshot.water.readings, cycle.current);',
            '  const waterPrevious = cycleConsumption(snapshot.water.readings, cycle.previous);',
            '  setText("#beta-cycle-label", `${formatShortDate(cycle.current.start)} – ${formatShortDate(cycle.current.end)}`);',
            '  setText("#beta-energy-consumption", `${formatNumber(energyCurrent.consumption)} kWh`);',
            '  setText("#beta-water-consumption", `${formatNumber(waterCurrent.consumption, 3)} m³`);',
            '  setText("#beta-energy-cost", currency(api.estimateEnergy(energyCurrent.consumption).totalCost));',
            '  setText("#beta-water-cost", currency(api.estimateWater(waterCurrent.consumption).totalCost));',
            '  renderComparison("#beta-energy-comparison", energyCurrent, energyPrevious);',
            '  renderComparison("#beta-water-comparison", waterCurrent, waterPrevious);',
            '  renderFinancialSummary(snapshot, cycle, energyCurrent, energyPrevious, waterCurrent, waterPrevious);',
            '}',
            '',
            'function renderAdministrationNavigation() {',
            '  const nav = document.querySelector("#beta-users-nav");',
            '  if (!nav) return;',
            '  nav.hidden = !api.getAdminSnapshot().authorized;',
            '}',
            '',
            'function renderFinancialSummary'
          ];
          source = source.replace(renderPattern, renderLines.join('\n'));
          assert.doesNotMatch(source, /if \(!document\.hidden\) Promise\.all\(\[api\.refreshFeatureFlags\(\), api\.refreshOperationalMetrics\(\)\]\)/, 'refresh administrativo global permaneceu');
          assert.match(source, /activePage === "readings"/, 'renderização por página de leituras ausente');
          assert.match(source, /activePage === "users"/, 'renderização por página de usuários ausente');
          assert.match(source, /renderAdministrationNavigation/, 'navegação administrativa leve ausente');
          await writeFile(path, source);
          NODE
      - name: Validar sintaxe
        run: node --check beta/beta-shell.js
      - name: Commitar patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/beta-shell.js
          git commit -m "perf(beta): renderizar somente a página ativa"
          git push origin HEAD:fix/full-runtime-stabilization
