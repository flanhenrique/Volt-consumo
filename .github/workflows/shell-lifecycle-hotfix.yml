name: Consolidar lifecycle do shell Beta

on:
  push:
    branches: [fix/full-runtime-stabilization]
    paths:
      - ".github/workflows/shell-lifecycle-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Remover observer permanente e lazy-load administrativo
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const path = 'beta/beta-shell.js';
          assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), '8fcf910887a676ccadd3bf422f3276a544341794');
          let source = await readFile(path, 'utf8');
          const replaceOnce = (from, to, label) => {
            assert.equal(source.split(from).length - 1, 1, `${label}: trecho não encontrado de forma única`);
            source = source.replace(from, to);
          };
          replaceOnce(
            'let reminderTimer;',
            ['let reminderTimer;', 'let administrationLoadPromise = null;'].join('\n'),
            'estado administrativo'
          );
          replaceOnce(
            ['  new MutationObserver(() => {', '    if (!dashboard.hidden) {', '      renderBetaExperience();', '      requestAnimationFrame(resetPageScroll);', '    }', '  }).observe(dashboard, { attributes: true, attributeFilter: ["hidden"] });', ''].join('\n'),
            '',
            'observer permanente do dashboard'
          );
          replaceOnce(
            ['  renderBetaExperience();', '  requestAnimationFrame(resetPageScroll);', '}'].join('\n'),
            ['  renderBetaExperience();', '  if (pageName === "users") void loadAdministrationPage();', '  requestAnimationFrame(resetPageScroll);', '}'].join('\n'),
            'showPage lazy admin'
          );
          const adminMarker = 'function bindAdministration(shell) {';
          assert.equal(source.split(adminMarker).length - 1, 1, 'bindAdministration ausente');
          source = source.replace(adminMarker, [
            'function loadAdministrationPage() {',
            '  if (administrationLoadPromise) return administrationLoadPromise;',
            '  administrationLoadPromise = Promise.all([',
            '    api.refreshAdmin(),',
            '    api.refreshFeatureFlags(),',
            '    api.refreshOperationalMetrics()',
            '  ])',
            '    .then(renderAdministration)',
            '    .catch(renderAdministration)',
            '    .finally(() => { administrationLoadPromise = null; });',
            '  return administrationLoadPromise;',
            '}',
            '',
            adminMarker
          ].join('\n'));
          replaceOnce(
            '  Promise.all([api.refreshAdmin(), api.refreshFeatureFlags(), api.refreshOperationalMetrics()]).then(renderAdministration).catch(renderAdministration);',
            '  Promise.resolve(api.refreshAdmin()).then(renderAdministrationNavigation).catch(renderAdministrationNavigation);',
            'carga administrativa inicial'
          );
          assert.doesNotMatch(source, /new MutationObserver\(\(\) => \{\s*if \(!dashboard\.hidden\)/, 'observer permanente do dashboard permaneceu');
          assert.match(source, /pageName === "users"\) void loadAdministrationPage/, 'Usuários não carrega sob demanda');
          await writeFile(path, source);
          NODE
      - name: Validar JavaScript
        run: node --check beta/beta-shell.js
      - name: Commitar lifecycle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/beta-shell.js
          git commit -m "perf(beta): limitar administração à página ativa"
          git push origin HEAD:fix/full-runtime-stabilization
