name: Atualizar bandeiras ANEEL

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: update-aneel-flags
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Importar competências publicadas
        run: python scripts/update-aneel-flags.py
      - name: Validar e publicar somente mudança oficial
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/consumption-domain/browser/billing-engine.js; then
            echo "Sem novas competências."
            exit 0
          fi
          python scripts/bump-pwa-release.py
          python tests/quality_gate.py
          node --test tests/billing-domain.test.mjs tests/forecast-aneel.test.mjs
          git config user.name "volt-tariff-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git commit -m "data(tariff): sincronizar bandeiras ANEEL e coorte PWA"
          git push origin HEAD:main
