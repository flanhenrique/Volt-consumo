name: VOLT
options:
  bundleIdPrefix: br.com.voltconsumo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Volt:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: VoltApp
    info:
      path: VoltApp/Info.plist
      properties:
        CFBundleDisplayName: VOLT
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: br.com.voltconsumo.app
            CFBundleURLSchemes:
              - volt
    entitlements:
      path: VoltApp/VoltApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.voltconsumo.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: VoltWidgetExtension

  VoltWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: VoltWidget
    info:
      path: VoltWidget/Info.plist
      properties:
        CFBundleDisplayName: VOLT
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VoltWidget/VoltWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.voltconsumo.app.widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
